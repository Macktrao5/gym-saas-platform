<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Socio - TRUD GYMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex items-center justify-center py-12 px-6">

    <div class="max-w-xl w-full bg-gray-900/60 backdrop-blur-xl border border-gray-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl font-black tracking-wider text-white">TRUD <span class="text-orange-500">GYMS</span></h1>
            <p class="text-xs text-gray-400 mt-2">Crea il tuo account socio e compila la tua tessera anagrafica.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5 relative z-10">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Nome</label>
                    <input type="text" name="first_name" required placeholder="Es. Mario" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Cognome</label>
                    <input type="text" name="last_name" required placeholder="Es. Rossi" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Username / Nickname</label>
                    <input type="text" name="username" required placeholder="Es. mariosport" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Età</label>
                    <input type="number" name="age" placeholder="Es. 26" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Altezza (cm)</label>
                    <input type="number" name="height" placeholder="Es. 175" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Peso (kg)</label>
                    <input type="number" step="0.1" name="weight" placeholder="Es. 75.5" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Contatto Telefonico</label>
                <input type="text" name="phone" placeholder="Es. +39 300 0000000" class="w-full bg-gray-950 border border-gray-800 text-white px-4 py-3 rounded-xl text-xs focus:outline-none focus:border-orange-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Foto Profilo / Tessera</label>
                <input type="file" name="photo" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer bg-gray-950 border border-gray-800 rounded-xl">
            </div>

            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-orange-600/30 cursor-pointer mt-4">
                Completa Registrazione & Accedi
            </button>
        </form>
    </div>

</body>
</html>
