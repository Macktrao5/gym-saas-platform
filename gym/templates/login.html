<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accedi - Assets Palestra</title>
    <style>
        body {
            background-color: #0d1117; /* Sfondo blu scuro coordinato */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #0C111F; /* Box scuro stile card */
            border-radius: 1.5rem;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        h2 {
            margin-bottom: 24px;
            text-align: center;
            color: #ffffff;
        }
        form p {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #8b949e;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #f97316; /* Bordo arancione al focus */
            outline: none;
        }
        .btn-primary {
            width: 100%;
            background-color: #f97316; /* Arancione coordinato dei pulsanti */
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background-color: #ea580c;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
        }
        .register-link a {
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Accedi ad Assets Palestra</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Accedi</button>
        </form>

        <div class="register-link">
            <p>Non hai ancora un account? <br><a href="{% url 'registrazione' %}">Registrati qui</a></p>
        </div>
    </div>

</body>
</html>
